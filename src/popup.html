<!DOCTYPE html>
<html>
  <head> </head>
  <body>
    <div>
      <input id="DisplayConsoleToggle"
             name="displayConsole"
             type="checkbox"
             checked/>
      <label for="DisplayConsoleToggle">Display Console</label>
    </div>
    <div>
      <input id="SlowModeToggle"
             name="slowMode"
             type="checkbox"/>
      <label for="SlowModeToggle">Slow Removal</label>
    </div>
    <button id="RemoveMessages">Remove Messages</button>
    <button id="Stop">Stop Removal</button>
    <div>Rate limit pause (in seconds)</div>
    <input type="number" id="Delay" min="5" value="5"/>
    <div id="Message"></div>
    <script type="application/javascript" src="browser-polyfill.js"></script>
    <script type="module" src="browser-polyfill.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
